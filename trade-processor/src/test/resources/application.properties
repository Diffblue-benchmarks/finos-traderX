# Test configuration for trade-processor
# Provides minimal configuration needed for Spring test contexts

# Use in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=create

# Mock trade feed address for tests (won't actually connect)
trade.feed.address=http://localhost:18086
